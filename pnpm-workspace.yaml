packages:
  - packages/*
  - apps/*

# Single source of truth for every third-party version in the workspace.
# Reference it from any package.json with "catalog:" instead of a range.
catalog:
  # Tooling
  "@types/node": ^24.13.3
  oxfmt: ^0.64.0
  oxlint: ^1.79.0
  publint: ^0.3.24
  tsdown: ^0.22.14
  typescript: ~6.0.2
  vite: ^8.2.0

  # Styling
  "@pandacss/dev": ^1.12.0
  postcss: ^8.5.26

  # Headless primitives
  "@ark-ui/react": ^5.38.2
  "@ark-ui/svelte": ^5.23.1
  "@ark-ui/vue": ^5.38.2

  # React
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  "@vitejs/plugin-react": ^6.0.4
  react: ^19.2.8
  react-dom: ^19.2.8

  # Vue
  "@vitejs/plugin-vue": ^6.0.8
  "@vue/tsconfig": ^0.9.1
  vue: ^3.5.40
  vue-tsc: ^3.3.8

  # Svelte
  "@sveltejs/package": ^2.5.8
  "@sveltejs/vite-plugin-svelte": ^7.2.0
  "@tsconfig/svelte": ^5.0.8
  svelte: ^5.56.8
  svelte-check: ^4.7.3

  # Storybook
  "@storybook/addon-docs": ^10.5.10
  "@storybook/addon-svelte-csf": ^5.1.2
  "@storybook/react-vite": ^10.5.10
  "@storybook/svelte-vite": ^10.5.10
  "@storybook/vue3-vite": ^10.5.10
  storybook: ^10.5.10

  # Docs
  "@astrojs/check": ^0.9.10
  astro: ^7.2.4

allowBuilds:
  esbuild: false
