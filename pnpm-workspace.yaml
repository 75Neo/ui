packages:
  - packages/*
  - apps/*

catalog:
  # Tooling
  "@types/node": ^26.4.1
  publint: ^0.3.24
  tsdown: ^0.22.14
  typescript: ~6.0.3

  # Styling
  "@tailwindcss/vite": ^4.3.3
  tailwindcss: ^4.3.3
  cn: 0.2.5
  class-variance-authority: 0.7.1

  # Icons
  "@lucide/astro": ^1.39.0
  "@lucide/vue": ^1.39.0
  lucide-react: ^1.39.0

  # React
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.5
  react: ^19.2.8
  react-dom: ^19.2.8

  # Vue
  vue: ^3.5.42
  vue-tsc: ^3.3.11

allowBuilds:
  esbuild: false
  puppeteer: false

minimumReleaseAgeExclude:
  - "@lucide/astro@1.39.0"
