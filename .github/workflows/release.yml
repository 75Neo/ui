name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Distribution tag to publish under
        default: latest
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish @75neo/ui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check npm is new enough for trusted publishing
        run: |
          version=$(npm --version)
          required=11.5.1
          if [ "$(printf '%s\n%s\n' "$required" "$version" | sort -V | head -1)" != "$required" ]; then
            echo "Trusted publishing needs npm $required or later, found $version."
            exit 1
          fi
          echo "npm $version"

      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./packages/ui/package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "Release $TAG does not match @75neo/ui $version."
            exit 1
          fi

      - name: Test
        run: pnpm test

      - name: Type check
        run: pnpm --filter @75neo/ui typecheck

      - name: Build
        run: pnpm --filter @75neo/ui build

      - name: Publish
        working-directory: packages/ui
        run: npm publish --ignore-scripts --tag "${{ inputs.tag || 'latest' }}"
