name: Docs

# The documentation site, published to Cloudflare Pages at https://75neo-ui.pages.dev.
#
# It builds on its own rather than waiting for CI: the docs read every props table out of
# the packages' sources, so a renamed prop fails this build rather than shipping a wrong
# table. `CLOUDFLARE_API_TOKEN` and `CLOUDFLARE_ACCOUNT_ID` are repository secrets, and
# wrangler reads the branch it ran on, so only master is a production deployment.

on:
  push:
    branches: [master]
    paths:
      - ".github/actions/setup/**"
      - ".github/workflows/docs.yml"
      - "apps/docs/**"
      - "mise.toml"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  workflow_dispatch:

# One deployment at a time, and never cancel one halfway: an interrupted publish leaves
# the live site on a half-uploaded build.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup
        with:
          turbo-cache-key: docs

      - name: Build
        run: pnpm exec turbo run build --filter docs

      # `pnpm dlx` rather than `cloudflare/wrangler-action`, which installs into the
      # checkout: pnpm refuses to add to a workspace root without `-w`, and npm cannot
      # read the `catalog:` protocol these manifests use.
      #
      # `pages deploy` will not create the project it deploys into and Cloudflare has no
      # create-if-missing, so this creates it and shrugs on every run after the first. A
      # token that cannot create one cannot deploy either, so the step below still fails.
      - name: Ensure the Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if pnpm dlx wrangler@4 pages project create 75neo-ui \
            --production-branch=master; then
            echo "Created the Pages project."
          else
            echo "The Pages project is already there, which is the usual case."
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4 pages deploy apps/docs/dist --project-name=75neo-ui
