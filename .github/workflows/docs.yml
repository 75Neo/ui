name: Docs

# The documentation site, published to Cloudflare Pages at https://75neo-ui.pages.dev.
#
# It builds on its own rather than waiting for CI, because the build is the check that
# matters here: the docs read every props table out of the packages' sources with
# ts-morph, so a renamed prop fails this build rather than shipping a wrong table.
#
# `CLOUDFLARE_API_TOKEN` and `CLOUDFLARE_ACCOUNT_ID` are repository secrets. A push to
# master is a production deployment; a manual run from any other branch is a preview,
# which is wrangler reading the branch it was run on rather than anything set here.

on:
  push:
    branches: [master]
    paths:
      - ".github/actions/setup/**"
      - ".github/workflows/docs.yml"
      - "apps/docs/**"
      - "mise.toml"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  workflow_dispatch:

# One deployment at a time, and never cancel one halfway: an interrupted publish leaves
# the live site on a half-uploaded build.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup
        with:
          turbo-cache-key: docs

      - name: Build
        run: pnpm exec turbo run build --filter docs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/docs/dist --project-name=75neo-ui
          # The action installs wrangler itself, and left to guess it picks pnpm from
          # the lockfile and runs `pnpm add` at the root of a workspace, which pnpm
          # refuses without `-w`. npm has no such objection, and wrangler is a tool this
          # deploy reaches for rather than a dependency of anything here.
          packageManager: npm
