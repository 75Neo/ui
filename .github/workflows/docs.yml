name: Docs

on:
  push:
    branches: [master]
    paths:
      - ".github/actions/setup/**"
      - ".github/workflows/docs.yml"
      - "astro.config.mjs"
      - "mise.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "public/**"
      - "registry/**"
      - "scripts/**"
      - "src/**"
      - "tsconfig.json"
  workflow_dispatch:

# One deployment at a time, and never cancel one halfway: an interrupted publish leaves
# the live site on a half-uploaded build.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      - name: Ensure the Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if pnpm dlx wrangler@4 pages project create 75neo-ui \
            --production-branch=master; then
            echo "Created the Pages project."
          else
            echo "The Pages project is already there, which is the usual case."
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4 pages deploy dist --project-name=75neo-ui
