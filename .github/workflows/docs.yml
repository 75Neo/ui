name: Docs

# The documentation site, published to Cloudflare Pages at https://75neo-ui.pages.dev.
#
# The same deployment serves the shadcn registry: `pnpm build` writes the registry items
# into `public/r` and Astro copies them into `dist`, so `shadcn add @75neo/button` reads
# whatever this workflow last published. `CLOUDFLARE_API_TOKEN` and
# `CLOUDFLARE_ACCOUNT_ID` are repository secrets, and wrangler reads the branch it ran on,
# so only master is a production deployment.

on:
  push:
    branches: [master]
    paths:
      - ".github/actions/setup/**"
      - ".github/workflows/docs.yml"
      - "astro.config.mjs"
      - "mise.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "public/**"
      - "registry.*.json"
      - "registry/**"
      - "src/**"
      - "tsconfig.json"
  workflow_dispatch:

# One deployment at a time, and never cancel one halfway: an interrupted publish leaves
# the live site on a half-uploaded build.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      # `pnpm dlx` rather than `cloudflare/wrangler-action`, which installs wrangler into
      # the checkout and would show up in the deployed tree.
      #
      # `pages deploy` will not create the project it deploys into and Cloudflare has no
      # create-if-missing, so this creates it and shrugs on every run after the first. A
      # token that cannot create one cannot deploy either, so the step below still fails.
      - name: Ensure the Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if pnpm dlx wrangler@4 pages project create 75neo-ui \
            --production-branch=master; then
            echo "Created the Pages project."
          else
            echo "The Pages project is already there, which is the usual case."
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4 pages deploy dist --project-name=75neo-ui
