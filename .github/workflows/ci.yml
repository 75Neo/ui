name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch supersedes the run already in flight for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repo or to any registry.
permissions:
  contents: read

env:
  # Mirrors mise.toml, which is what local dev uses. The first step below fails the run
  # if the two ever drift apart.
  NODE_VERSION: "24"
  PNPM_VERSION: "11"
  # Turborepo phones home with anonymous usage counts by default. CI has nothing to
  # gain from it and one less network call is one less way for a run to hang.
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  ci:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain matches mise.toml
        run: |
          set -euo pipefail
          node_pin=$(grep -oP '^\s*node\s*=\s*"\K[^"]+' mise.toml)
          pnpm_pin=$(grep -oP '^\s*pnpm\s*=\s*"\K[^"]+' mise.toml)
          if [ "$node_pin" != "$NODE_VERSION" ]; then
            echo "::error file=mise.toml::mise.toml pins node $node_pin, this workflow uses $NODE_VERSION"
            exit 1
          fi
          if [ "$pnpm_pin" != "$PNPM_VERSION" ]; then
            echo "::error file=mise.toml::mise.toml pins pnpm $pnpm_pin, this workflow uses $PNPM_VERSION"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Turborepo's local cache, carried between runs. Saved under this commit's SHA and
      # restored from the newest `-turbo-` key, so a re-run of the same commit replays
      # everything and a new commit still reuses every task whose inputs didn't move.
      - name: Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # There is no code generation step: Tailwind reads the design system straight
      # from `packages/styles/src`, so an install is the only prerequisite. Every check
      # below is guarded on it rather than on step order, because `!cancelled()` would
      # otherwise run them all against an empty `node_modules`.
      - name: Install
        id: setup
        run: pnpm install --frozen-lockfile

      # Each check below runs even when an earlier one failed, so a single push reports
      # every problem at once instead of one per round trip. The job still fails if any
      # of them do.
      - name: Format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm format:check

      - name: Lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm lint

      # tsc / vue-tsc / svelte-check / astro check across all 8 projects. Turborepo runs
      # them in parallel: none of them needs a dependency built, only its source hashed.
      - name: Types
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check

      - name: Build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm build

      # publint, over the four publishable manifests.
      - name: Package manifests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm lint:packages
